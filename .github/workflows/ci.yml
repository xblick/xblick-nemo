# xblick-nemo CI: the reference check, ruff, and the tests that need no GPU (tests/test_helpers.py; the tests
# that need a CUDA device skip without one).
name: ci

on:
  push:
  pull_request:

jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_references.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
      # uv fetches the core (xblick) from the public github.com/xblick/xblick at the commit in uv.lock.
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - name: Tests
        timeout-minutes: 20
        run: uv run --locked pytest -q tests
